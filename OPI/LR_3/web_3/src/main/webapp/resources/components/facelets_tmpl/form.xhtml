<h:form xmlns:h="http://java.sun.com/jsf/html"
        xmlns:pt="http://java.sun.com/jsf/passthrough"
        xmlns:p="http://primefaces.org/ui"
        xmlns:f="http://java.sun.com/jsf/core"
        prependId="false"
        id="mainform">
    <div class="sample-form">
        <label class="form-label">Координата X точки:</label>
        <h:inputText pt:placeholder="Установите X" id="x_input" value="#{pointBean.x}">
            <f:validateLongRange minimum="-2" maximum="2"/>
        </h:inputText>
<!--        <ace:sliderEntry id="x_input" value="#{PointBean.x}" min="-3" max="5" step="1" showValue="true" style="width: 300px;"/>-->
        <p:slider for="x_input" minValue="-3" maxValue="5" step="1" />
        <h:message for="x_input" style="color:red"/>
    </div>


    <div class="sample-form">
        <label class="form-label">Координата Y точки:</label>
        <h:inputText pt:placeholder="Введите Y" id="y_input" value="#{pointBean.y}" maxlength="10">
        </h:inputText>
        <h:message for="y_input" style="color:red"/>
    </div>
    <div class="sample-form">
        <label class="form-label">Радиус R:</label>
        <h:inputText pt:placeholder="Установите R" id="r_input" value="#{pointBean.r}">
            <f:validateDoubleRange minimum="2" maximum="5"/>
        </h:inputText>
        <p:slider for="r_input" minValue="2" maxValue="5" step="0.1" />
        <h:message for="r_input" style="color:red"/>
    </div>

    <div class="form-group">
        <h:commandButton id="submit" value="Отправить" action="#{pointManagerBean.throwPoint(pointBean)}">
        </h:commandButton>
    </div>
</h:form>
